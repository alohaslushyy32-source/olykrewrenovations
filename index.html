<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olykrew Renovations</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGO -->
  <header class="navbar">
    <img src="images/logo.png" class="logo" alt="Olykrew Logo">
  </header>

  <!-- HERO -->
  <main class="content">
    <div class="hero">
      <h1>Olykrew Renovations</h1>
      <p>Quality renovation work with a clean, modern finish.</p>
      <button class="btn">Get a Quote</button>
    </div>
  </main>

  <!-- SERVICES SECTION (NEW PROFESSIONAL LAYOUT) -->
  <section class="services">
    <h2>Our Services</h2>

    <div class="service-grid">
      <div class="service-box">
        <h3>Renovations</h3>
        <p>High-quality home remodeling and upgrades built to last.</p>
      </div>

      <div class="service-box">
        <h3>Restoration</h3>
        <p>Bringing damaged or outdated spaces back to life.</p>
      </div>

      <div class="service-box">
        <h3>Design Work</h3>
        <p>Modern, clean finishes tailored to your home.</p>
      </div>
    </div>
  </section>

  <!-- GALLERY -->
  <section class="gallery-section">
    <h2>Our Work</h2>
    <div id="gallery" class="gallery"></div>
  </section>

  <!-- FIREBASE SAFE INIT (DO NOT BREAK PAGE) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyDf1Lw6DX-zolIwPHe2sOz-7bsOboPlGm0",
        authDomain: "olykrew-website.firebaseapp.com",
        projectId: "olykrew-website",
        storageBucket: "olykrew-website.firebasestorage.app",
        messagingSenderId: "683329807063",
        appId: "1:683329807063:web:a4b5b68670210599e70692"
      };

      firebase.initializeApp(firebaseConfig);
    } catch (e) {}
  </script>

  <!-- GALLERY SCRIPT (CLEAN + ADMIN SAFE) -->
  <script>
    const gallery = document.getElementById("gallery");
    let images = JSON.parse(localStorage.getItem("gallery")) || [];

    let currentUser = null;

    if (firebase && firebase.auth) {
      firebase.auth().onAuthStateChanged(user => {
        currentUser = user;
        renderGallery();
      });
    } else {
      renderGallery();
    }

    function renderGallery() {
      gallery.innerHTML = "";

      images.forEach((url, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "img-wrapper";

        const img = document.createElement("img");
        img.src = url;
        img.className = "gallery-img";

        wrapper.appendChild(img);

        if (currentUser) {
          const btn = document.createElement("button");
          btn.innerText = "X";
          btn.className = "delete-btn";

          btn.onclick = () => {
            images.splice(index, 1);
            localStorage.setItem("gallery", JSON.stringify(images));
            renderGallery();
          };

          wrapper.appendChild(btn);
        }

        gallery.appendChild(wrapper);
      });
    }

    renderGallery();
  </script>

</body>
</html>
