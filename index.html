<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olykrew Renovations</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP LEFT LOGO -->
  <header class="navbar">
    <img src="images/logo.png" class="logo" alt="Olykrew Logo">
  </header>

  <!-- MAIN HERO SECTION -->
  <main class="content">
    <div class="hero">
      <h1>Olykrew Renovations</h1>
      <p>Quality renovation work with a clean, modern finish.</p>

      <button class="btn">Get a Quote</button>
    </div>
  </main>

  <!-- GALLERY SECTION -->
  <section class="gallery-section">
    <h2>Our Work</h2>
    <div id="gallery" class="gallery"></div>
  </section>

  <!-- CLOUDINARY GALLERY SCRIPT -->
  <script>
const cloudName = "dwpiqfg7r"; // your cloud name
const folder = "Olykrewrenovations"; // your asset folder

const gallery = document.getElementById("gallery");

fetch(`https://res.cloudinary.com/${cloudName}/image/list/${folder}.json`)
  .then(res => res.json())
  .then(data => {
    if (!data.resources) return;

    data.resources.forEach(img => {
      const image = document.createElement("img");
      image.src = img.secure_url;
      image.className = "gallery-img";
      gallery.appendChild(image);
    });
  })
  .catch(err => {
    console.log("Gallery error:", err);
  });
</script>

</body>
</html>
