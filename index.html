<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olykrew Renovations</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #2b1b12;
      color: #f5e6d3;
    }

    /* TOP BAR */
    .navbar {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: #3a2418;
    }

    /* LOGO */
    .logo {
      height: 60px;
      width: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* CONTENT */
    .content {
      text-align: center;
      padding: 100px 20px;
    }

    h1 {
      color: #d2a679;
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #f5e6d3;
    }

    .box {
      display: inline-block;
      padding: 25px;
      border: 2px solid #d2a679;
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <!-- TOP LEFT LOGO -->
  <div class="navbar">
    <img src="logo.png" class="logo" alt="Olykrew Renovations Logo">
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <div class="box">
      <h1>Olykrew Renovations</h1>
      <p>Quality renovation work with a clean, modern finish.</p>
    </div>
  </div>

</body>
</html>
