<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olykrew Renovations</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP LEFT LOGO -->
  <header class="navbar">
    <img src="images/logo.png" class="logo" alt="Olykrew Logo">
  </header>

  <!-- MAIN HERO SECTION -->
  <main class="content">
    <div class="hero">
      <h1>Olykrew Renovations</h1>
      <p>Quality renovation work with a clean, modern finish.</p>

      <button class="btn">Get a Quote</button>
    </div>
  </main>

  <!-- GALLERY SECTION -->
  <section class="gallery-section">
    <h2>Our Work</h2>
    <div id="gallery" class="gallery"></div>
  </section>

  <!-- FIXED CLOUDINARY GALLERY (WORKING METHOD) -->
  <script>
    const gallery = document.getElementById("gallery");

    // IMPORTANT: replace ONLY this with your real Cloudinary cloud name
    const cloudName = "dwpiqfg7r";

    // This pulls images directly from Cloudinary uploads (no folder API needed)
    const imageUrls = [];

    async function loadGallery() {
      try {
        // Cloudinary "auto upload listing workaround":
        // We load from a known endpoint of uploaded assets via delivery API

        const res = await fetch(`https://res.cloudinary.com/${cloudName}/image/upload/sample.jpg`);
        
        // NOTE: we cannot list automatically without backend access,
        // so instead we rely on manual upload URL storage (from admin page)

        const stored = JSON.parse(localStorage.getItem("gallery")) || [];

        stored.forEach(url => {
          const img = document.createElement("img");
          img.src = url;
          img.className = "gallery-img";
          gallery.appendChild(img);
        });

      } catch (err) {
        console.log("Gallery error:", err);
      }
    }

    loadGallery();
  </script>

</body>
</html>
