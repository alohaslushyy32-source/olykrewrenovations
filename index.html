<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olykrew Renovations</title>
<link rel="stylesheet" href="style.css">

<style>
#loader{transition:opacity .6s ease;pointer-events:none}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-text">Olykrew Renovations</div>
</div>

<!-- TOP BAR -->
<header class="topbar">
  <img src="images/logo.png" class="logo">

  <div class="nav-right">
    <a href="#services">Services</a>
    <a href="#gallery">Work</a>
    <a href="#liveGallery">Live Gallery</a>
    <a href="#contact" class="cta">Get Quote</a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-overlay">
    <h1>Luxury Renovation & Restoration</h1>
    <p>Precision craftsmanship. Modern design. Built to last.</p>
  </div>
</section>

<!-- VIDEO -->
<section class="video-section">
<video autoplay muted loop playsinline class="service-video">
<source src="videos/background.mp4">
</video>
</section>

<!-- STATIC GALLERY -->
<section id="gallery" class="section">

<h2>Project Portfolio</h2>

<div class="project-grid static-gallery">

<div class="project-card" data-category="closet"><img src="images/closet.jpg"><div>closet</div></div>
<div class="project-card" data-category="flooring"><img src="images/flooring.jpg"><div>flooring</div></div>
<div class="project-card" data-category="bathroom"><img src="images/bathroom.jpg"><div>bathroom</div></div>
<div class="project-card" data-category="kitchen"><img src="images/kitchen.jpg"><div>kitchen</div></div>

</div>

</section>

<!-- LIVE GALLERY -->
<section id="liveGallery" class="section">
<h2>Live Gallery</h2>
<div id="liveGrid" class="project-grid"></div>
</section>

<!-- CATEGORY TABS (IMPORTANT FIX) -->
<section class="section">

<div id="closet"></div>
<div id="shower"></div>
<div id="flooring"></div>
<div id="bathroom"></div>
<div id="kitchen"></div>

</section>

<!-- CONTACT -->
<section id="contact">
<a href="mailto:yourbusiness@email.com">Email Us</a>
</section>

<!-- LOADER SCRIPT -->
<script>
window.addEventListener("load",()=>{
const l=document.getElementById("loader");
if(!l) return;
l.style.opacity="0";
setTimeout(()=>l.remove(),500);
});
</script>

<!-- SCROLL ANIMATION -->
<script>
const els=document.querySelectorAll(".section,.project-card");
const obs=new IntersectionObserver(e=>{
e.forEach(x=>{
if(x.isIntersecting)x.target.classList.add("show");
});
},{threshold:.15});
els.forEach(e=>obs.observe(e));
</script>

<!-- FIREBASE FIXED SYSTEM -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyDf1Lw6DX-zolIwPHe2sOz-7bsOboPlGm0",
authDomain:"olykrew-website.firebaseapp.com",
projectId:"olykrew-website"
});

const db=firebase.firestore();

const liveGrid=document.getElementById("liveGrid");

const sections={
closet:document.getElementById("closet"),
shower:document.getElementById("shower"),
flooring:document.getElementById("flooring"),
bathroom:document.getElementById("bathroom"),
kitchen:document.getElementById("kitchen")
};

db.collection("projects")
.orderBy("created","desc")
.onSnapshot(snap=>{

if(liveGrid) liveGrid.innerHTML="";

Object.values(sections).forEach(s=>{
if(s) s.innerHTML="";
});

snap.forEach(doc=>{
const d=doc.data();

const card=document.createElement("div");
card.className="project-card";
card.innerHTML=`
<img src="${d.url}">
<div class="project-info">${d.category || "live"}</div>
`;

const cat=d.category || "live";

if(cat==="live"){
liveGrid.appendChild(card);
return;
}

if(sections[cat]){
sections[cat].appendChild(card);
return;
}

liveGrid.appendChild(card);
});

});
</script>

<!-- FOOTER -->
<footer class="bottom-bar">
<div>Olykrew Renovations</div>
</footer>

</body>
</html>
