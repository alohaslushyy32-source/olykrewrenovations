<!DOCTYPE html>
<html>
<head>
    <title>Photo Upload</title>
</head>

<body>

<h1>Upload Photos</h1>

<input type="password" id="password" placeholder="Password">
<button onclick="unlock()">Login</button>

<div id="uploadArea" style="display:none;">
    <input type="file" id="fileInput">
    <button onclick="uploadImage()">Upload</button>
</div>

<script>
const SITE_PASSWORD = "Olykrew123";

function unlock() {
    const pass = document.getElementById("password").value;

    if(pass === SITE_PASSWORD){
        document.getElementById("uploadArea").style.display = "block";
    } else {
        alert("Wrong password");
    }
}

async function uploadImage() {
    const file = document.getElementById("fileInput").files[0];

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "Olykrewrenovations");

    const response = await fetch(
        "https://api.cloudinary.com/v1_1/dwpiqfg7r/image/upload",
        {
            method: "POST",
            body: formData
        }
    );

    const data = await response.json();

    // 🔥 ONLY CHANGE: store uploaded image for your website gallery
    let stored = JSON.parse(localStorage.getItem("gallery")) || [];
    stored.push(data.secure_url);
    localStorage.setItem("gallery", JSON.stringify(stored));

    alert("Uploaded!");
    console.log(data.secure_url);
}
</script>

</body>
</html>
