<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Upload</title>

    <!-- LINKS IT TO YOUR MAIN WEBSITE STYLE -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SAME LOGO STYLE AS HOMEPAGE -->
    <header class="navbar">
        <img src="images/logo.png" class="logo" alt="Olykrew Logo">
    </header>

    <!-- CENTERED CONTENT USING YOUR EXISTING LAYOUT -->
    <main class="content">

        <div class="admin-box">

            <h1>Upload Photos</h1>

            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="unlock()">Login</button>

            <div id="uploadArea" style="display:none; margin-top:20px;">
                <input type="file" id="fileInput">
                <br><br>
                <button class="btn" onclick="uploadImage()">Upload</button>
            </div>

        </div>

    </main>

    <script>
    const SITE_PASSWORD = "OlyKrew2023!$";

    function unlock() {
        const pass = document.getElementById("password").value;

        if(pass === SITE_PASSWORD){
            document.getElementById("uploadArea").style.display = "block";
        } else {
            alert("Wrong password");
        }
    }

    async function uploadImage() {
        const file = document.getElementById("fileInput").files[0];

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", "Olykrewrenovations");

        const response = await fetch(
            "https://api.cloudinary.com/v1_1/dwpiqfg7r/image/upload",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        alert("Uploaded!");
        console.log(data.secure_url);
    }
    </script>

</body>
</html>
