<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="stylesheet" href="style.css">

<style>
.admin-wrap{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:350px;
  background:rgba(0,0,0,0.8);
  padding:20px;
  border-radius:10px;
  z-index:9999;
  position:relative;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  color:black;
}
</style>
</head>

<body>

<div class="admin-wrap">
  <div class="card">

    <h2>Admin Login</h2>

    <div id="loginBox">
      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>

    <div id="uploadArea" style="display:none;">
      <h2>Upload</h2>
      <input type="file" id="fileInput">
      <button onclick="upload()">Upload</button>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyDf1Lw6DX-zolIwPHe2sOz-7bsOboPlGm0",
authDomain:"olykrew-website.firebaseapp.com",
projectId:"olykrew-website"
});

const auth = firebase.auth();
const db = firebase.firestore();

function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.then(()=>{
document.getElementById("loginBox").style.display="none";
document.getElementById("uploadArea").style.display="block";
});
}

async function upload(){
const file=fileInput.files[0];

const form=new FormData();
form.append("file",file);
form.append("upload_preset","Olykrewrenovations");

const res=await fetch("https://api.cloudinary.com/v1_1/dwpiqfg7r/image/upload",{method:"POST",body:form});
const data=await res.json();

await db.collection("projects").add({
url:data.secure_url,
created:Date.now()
});

alert("Uploaded");
}
</script>

</body>
</html>
