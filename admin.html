<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Olykrew Admin</title>

<link rel="stylesheet" href="style.css">

<style>

body{
  background:#050505;
  font-family:Arial;
  color:white;
}

.admin-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.admin-card{
  width:420px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  padding:25px;
  border-radius:15px;
  border:1px solid rgba(212,175,55,0.35);
  text-align:center;
}

h2{
  color:#d4af37;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#d4af37;
  color:#050505;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  box-shadow:0 0 20px rgba(212,175,55,0.5);
}

/* CATEGORY BUTTONS */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:10px;
}

.cat-btn{
  background:rgba(255,255,255,0.08);
  color:white;
  border:1px solid rgba(212,175,55,0.3);
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.cat-btn:hover{
  background:#d4af37;
  color:#050505;
}

.section{
  margin-top:25px;
  padding-top:15px;
  border-top:1px solid rgba(255,255,255,0.1);
}

#message{
  margin-top:10px;
  color:#d4af37;
}

</style>

</head>

<body>

<div class="admin-wrap">
<div class="admin-card">

<h2>Olykrew Admin</h2>

<!-- FILE -->
<input type="file" id="fileInput">

<div id="message"></div>

<!-- 🟨 CATEGORIZED UPLOAD -->
<div class="section">

<h3>Portfolio Upload (Categorized)</h3>

<div class="cat-grid">

<button class="cat-btn" onclick="uploadCat('closets')">Closets</button>
<button class="cat-btn" onclick="uploadCat('showers')">Showers</button>
<button class="cat-btn" onclick="uploadCat('flooring')">Flooring</button>
<button class="cat-btn" onclick="uploadCat('kitchen')">Kitchen</button>
<button class="cat-btn" onclick="uploadCat('bathroom')">Bathroom</button>
<button class="cat-btn" onclick="uploadCat('painting')">Painting</button>

</div>

</div>

<!-- 🟦 LIVE UPLOAD -->
<div class="section">

<h3>Live Gallery Upload</h3>

<button onclick="uploadLive()">Upload to Live Gallery</button>

</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

firebase.initializeApp({
  apiKey:"AIzaSyDf1Lw6DX-zolIwPHe2sOz-7bsOboPlGm0",
  authDomain:"olykrew-website.firebaseapp.com",
  projectId:"olykrew-website"
});

const db = firebase.firestore();

/* UPLOAD FUNCTION */
async function uploadToCollection(collection){

  const file = document.getElementById("fileInput").files[0];

  if(!file){
    message.innerHTML = "Select a file first";
    return;
  }

  message.innerHTML = "Uploading...";

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", "Olykrewrenovations");

  const res = await fetch(
    "https://api.cloudinary.com/v1_1/dwpiqfg7r/image/upload",
    { method:"POST", body:form }
  );

  const data = await res.json();

  await db.collection(collection).add({
    url: data.secure_url,
    created: Date.now()
  });

  message.innerHTML = "Uploaded successfully!";
  document.getElementById("fileInput").value = "";
}

/* CATEGORY UPLOAD */
function uploadCat(category){
  uploadToCollection("categorizedProjects").then(() => {
    db.collection("categorizedProjects").add({
      url: "",
      category: category
    });
  });
}

/* LIVE UPLOAD */
function uploadLive(){
  uploadToCollection("liveProjects");
}

</script>

</body>
</html>
