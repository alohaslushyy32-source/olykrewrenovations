<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGO -->
  <header class="navbar">
    <img src="images/logo.png" class="logo" alt="Olykrew Logo">
  </header>

  <!-- CENTER -->
  <main class="content">

    <div class="admin-box">

      <h1>Admin Login</h1>

      <!-- LOGIN -->
      <div id="loginBox">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
      </div>

      <!-- UPLOAD -->
      <div id="uploadArea" style="display:none; margin-top:20px;">
        <h2>Upload Photos</h2>
        <input type="file" id="fileInput">
        <br><br>
        <button class="btn" onclick="uploadImage()">Upload</button>
      </div>

    </div>

  </main>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDf1Lw6DX-zolIwPHe2sOz-7bsOboPlGm0",
      authDomain: "olykrew-website.firebaseapp.com",
      projectId: "olykrew-website",
      storageBucket: "olykrew-website.firebasestorage.app",
      messagingSenderId: "683329807063",
      appId: "1:683329807063:web:a4b5b68670210599e70692"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // LOGIN FUNCTION
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          document.getElementById("loginBox").style.display = "none";
          document.getElementById("uploadArea").style.display = "block";
        })
        .catch(err => alert(err.message));
    }

    // UPLOAD FUNCTION (ONLY WORKS AFTER LOGIN)
    async function uploadImage() {
      const file = document.getElementById("fileInput").files[0];

      if (!file) {
        alert("Please select a file");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", "Olykrewrenovations");

      const response = await fetch(
        "https://api.cloudinary.com/v1_1/dwpiqfg7r/image/upload",
        {
          method: "POST",
          body: formData
        }
      );

      const data = await response.json();

      let stored = JSON.parse(localStorage.getItem("gallery")) || [];
      stored.push(data.secure_url);
      localStorage.setItem("gallery", JSON.stringify(stored));

      alert("Uploaded successfully!");
    }
  </script>

</body>
</html>
