<script>
firebase.initializeApp({
  apiKey:"AIzaSyDf1Lw6DX-zolIwPHe2sOz-7bsOboPlGm0",
  authDomain:"olykrew-website.firebaseapp.com",
  projectId:"olykrew-website"
});

const auth = firebase.auth();
const db = firebase.firestore();

function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(()=>{
    loginBox.style.display="none";
    uploadArea.style.display="block";
    message.innerHTML="Logged in";
    loadProjects();
  })
  .catch(e=>{
    message.innerHTML=e.message;
  });
}

async function upload(){

  const file = document.getElementById("fileInput").files[0];
  const category = document.getElementById("category").value;

  console.log("FILE:", file);
  console.log("CATEGORY:", category);

  if(!file){
    message.innerHTML = "❌ Pick a file first";
    return;
  }

  try{

    message.innerHTML = "Uploading...";

    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", "Olykrewrenovations");

    const res = await fetch(
      "https://api.cloudinary.com/v1_1/dwpiqfg7r/image/upload",
      { method: "POST", body: form }
    );

    const data = await res.json();

    console.log("CLOUDINARY RESPONSE:", data);

    if(!data.secure_url){
      message.innerHTML = "❌ Upload failed (check console)";
      return;
    }

    await db.collection("projects").add({
      url: data.secure_url,
      category: category,
      created: Date.now()
    });

    message.innerHTML = "✅ Uploaded successfully!";
    fileInput.value = "";

  } catch(err){
    console.log("UPLOAD ERROR:", err);
    message.innerHTML = "❌ Upload error (check console)";
  }
}

function loadProjects(){
  const gallery = document.getElementById("adminGallery");

  db.collection("projects")
  .orderBy("created","desc")
  .onSnapshot(snapshot=>{
    gallery.innerHTML="";

    snapshot.forEach(doc=>{
      const d = doc.data();

      const div = document.createElement("div");
      div.className="admin-photo";

      div.innerHTML = `
        <img src="${d.url}">
        <div style="color:#d4af37;font-size:12px">${d.category || "live"}</div>
        <button class="delete-btn" onclick="deleteProject('${doc.id}')">
          Delete
        </button>
      `;

      gallery.appendChild(div);
    });
  });
}

function deleteProject(id){
  if(confirm("Delete this project?")){
    db.collection("projects").doc(id).delete();
  }
}

function logout(){
  auth.signOut();
  location.reload();
}
</script>
