<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Olykrew Admin</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#050505;
  font-family: Arial, sans-serif;
  margin:0;
  padding:0;
}

.admin-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.admin-card{
  width:420px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  padding:25px;
  border-radius:15px;
  border:1px solid rgba(212,175,55,0.35);
  text-align:center;
}

h2, h3{
  color:#d4af37;
}

input, select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:none;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:#d4af37;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  box-shadow:0 0 20px rgba(212,175,55,.5);
}

#adminGallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.admin-photo{
  background:rgba(255,255,255,0.05);
  padding:8px;
  border-radius:10px;
}

.admin-photo img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
}

.delete-btn{
  background:#8b0000;
  color:white;
  margin-top:5px;
}

#message{
  color:#d4af37;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="admin-wrap">
  <div class="admin-card">

    <h2>Olykrew Admin</h2>

    <!-- LOGIN -->
    <div id="loginBox">
      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>

    <!-- UPLOAD -->
    <div id="uploadArea" style="display:none;">

      <h3>Upload Category</h3>

      <select id="category">
        <option value="live">Live (Unsorted)</option>
        <option value="closet">Closet</option>
        <option value="shower">Shower</option>
        <option value="flooring">Flooring</option>
        <option value="bathroom">Bathroom</option>
        <option value="kitchen">Kitchen</option>
      </select>

      <input type="file" id="fileInput">

      <button onclick="upload()">Upload</button>

      <h3>Current Projects</h3>
      <div id="adminGallery"></div>

      <button onclick="logout()">Logout</button>
    </div>

    <div id="message"></div>

  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDf1Lw6DX-zolIwPHe2sOz-7bsOboPlGm0",
  authDomain: "olykrew-website.firebaseapp.com",
  projectId: "olykrew-website"
});

const auth = firebase.auth();
const db = firebase.firestore();
  
const message = document.getElementById("message");
const fileInput = document.getElementById("fileInput");

function login(){
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  )
  .then(()=>{
    document.getElementById("loginBox").style.display="none";
    document.getElementById("uploadArea").style.display="block";
    document.getElementById("message").innerHTML="Logged in";
    loadProjects();
  })
  .catch(err=>{
    document.getElementById("message").innerHTML=err.message;
  });
}

async function upload(){

  const file = document.getElementById("fileInput").files[0];
  const category = document.getElementById("category").value;

  if(!file){
    document.getElementById("message").innerHTML="Pick a file first";
    return;
  }

  document.getElementById("message").innerHTML="Uploading...";

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", "Olykrewrenovations");

  try {
    const res = await fetch("https://api.cloudinary.com/v1_1/dwpiqfg7r/image/upload", {
      method: "POST",
      body: form
    });

    const data = await res.json();

    if(!data.secure_url){
      document.getElementById("message").innerHTML="Upload failed";
      return;
    }

    await db.collection("projects").add({
      url: data.secure_url,
      category: category,
      created: Date.now()
    });

    document.getElementById("fileInput").value = "";
    document.getElementById("message").innerHTML="Uploaded successfully";

  } catch (err){
    console.log(err);
    document.getElementById("message").innerHTML="Upload error";
  }
}

function loadProjects(){

  const gallery = document.getElementById("adminGallery");

  db.collection("projects")
  .orderBy("created","desc")
  .onSnapshot(snapshot => {

    gallery.innerHTML = "";

    snapshot.forEach(doc => {

      const d = doc.data();

      const div = document.createElement("div");
      div.className = "admin-photo";

      div.innerHTML = `
        <img src="${d.url}">
        <div style="color:#d4af37;font-size:12px">${d.category}</div>
        <button class="delete-btn" onclick="deleteProject('${doc.id}')">Delete</button>
      `;

      gallery.appendChild(div);
    });
  });
}

function deleteProject(id){
  db.collection("projects").doc(id).delete();
}

function logout(){
  auth.signOut();
  location.reload();
}
</script>

</body>
</html>
